# electron-builder.yml —— 安装包配置。
#
# 桌面外壳（electron/main.cjs）会从 resources/app 里跑构建好的 Next.js 服务，
# 所以 `.next` 和生产依赖的 node_modules 必须一起打包进去。
# asar 必须关闭：Next.js 运行时按真实文件路径解析文件，asar 虚拟文件系统会失败。
appId: com.pi.harness.desktop
productName: pi harness
# 不重新编译原生模块（本项目没有需要 rebuild 的依赖）。
npmRebuild: false
asar: false
# 直接复用本地已下载的 Electron，避免打包时再次联网下载。
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: electron
files:
  - electron/**/*
  - .next/**/*
  # 排除缓存、开发产物和 sourcemap，减小安装包体积
  - "!.next/cache/**"
  - "!.next/dev/**"
  - "!.next/**/*.map"
  - next.config.ts
  - package.json
  - "!node_modules/**/*.map"
win:
  target:
    - nsis
  icon: electron/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: pi harness
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
mac:
  icon: electron/icon.png
linux:
  icon: electron/icon.png
  target:
    - AppImage
