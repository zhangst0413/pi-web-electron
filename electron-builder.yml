# electron-builder config for the Pi Web desktop shell (electron/main.js).
#
# The shell starts the same Next.js server the `pi-web` command starts, so the
# packaged app carries the built `.next/` folder and the production node_modules
# next to it. `asar` is off on purpose: Next and node-pty load files by real path
# at runtime, and the launcher spawns `bin/pi-web.js` from there.
appId: com.agegr.piweb.desktop
productName: Pi Web
copyright: MIT
# node-pty ships N-API prebuilds that load in both Node and Electron, so no
# native rebuild is needed; without this, electron-builder wants a full Visual
# Studio toolchain on the build machine.
npmRebuild: false
asar: false
# The devDependency's electron install already holds the unpacked distribution
# (downloaded once by bin/ensure-electron.js through the mirror in
# package.json's config block). Pointing electron-builder at it skips its own
# 158 MB zip download and extraction on every build.
electronDist: node_modules/electron/dist
directories:
  output: desktop-dist
  buildResources: electron/build-resources
files:
  - electron/**/*
  - "!electron/build-resources/**"
  - bin/**/*
  - .next/**/*
  - "!.next/cache/**"
  - "!.next/dev/**"
  - "!.next/**/*.map"
  - public/**/*
  - next.config.ts
  - package.json
  # Next's SWC native package must stay: `next start` compiles next.config.ts
  # with it. `sharp` (@img) is not: images.unoptimized is set in next.config.ts,
  # so the optimizer never runs. 19 MB less to compress.
  - "!node_modules/@img/**"
  - "!node_modules/**/*.map"
win:
  # NSIS only: the portable target re-packs the whole ~1 GB app into a second
  # self-extracting exe and doubles the build time. Add `- portable` here if a
  # single-file build is ever needed.
  target:
    - nsis
  # A real multi-size .ico, not a PNG electron-builder would downscale: the
  # taskbar and Explorer draw 16/24/32 px icons, and those must be crisp.
  icon: electron/build-resources/icon.ico
nsis:
  oneClick: false
  # Setup and uninstaller carry the same icon as the app, not NSIS's own.
  installerIcon: electron/build-resources/icon.ico
  uninstallerIcon: electron/build-resources/icon.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Pi Web
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
